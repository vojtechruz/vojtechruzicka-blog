name: CI — Build & Test

# Runs on every push (including master, so direct pushes to the deploy branch are gated)
# and on PRs targeting master.
on:
  pull_request:
    branches: [master]
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (Mermaid diagram rendering)
        run: npx playwright install --with-deps chromium

      - name: Lint JavaScript
        run: npm run validate:js

      - name: Lint Stylesheets
        run: npm run validate:css

      - name: Validate Markdown
        run: npm run validate:md

      # Generated images are keyed by content hash of source + options, so a stale
      # or partial cache is always safe - eleventy-img re-encodes only what's missing.
      - name: Restore image cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/image-mirror
          key: images-${{ hashFiles('src/posts/**/*.jpg', 'src/posts/**/*.jpeg', 'src/posts/**/*.png', 'src/posts/**/*.gif', 'config/plugins/image.js') }}
          restore-keys: |
            images-

      - name: Build site
        run: npm run build
        env:
          # Lean image variant for CI - avif encoding dominates build time and
          # CI only validates markup. Production builds keep the full defaults.
          ELEVENTY_IMAGE_FORMATS: webp,auto
          ELEVENTY_IMAGE_WIDTHS: 800,auto
          # Pin CI to a production-shaped build. Without this, GITHUB_REF_NAME makes every
          # feature branch look like a preview deploy, which pulls "ready" drafts into the
          # output and marks every page noindex - both break tests that assert against the
          # production artifact (tests/drafts.test.js, tests/preview-noindex.test.js).
          # This one variable covers drafts, robots, favicon and analytics together.
          DEPLOY_ENV: production

      # Save even when the build (or a later step) fails, so completed encode
      # work is never thrown away.
      - name: Save image cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/image-mirror
          key: images-${{ hashFiles('src/posts/**/*.jpg', 'src/posts/**/*.jpeg', 'src/posts/**/*.png', 'src/posts/**/*.gif', 'config/plugins/image.js') }}

      # Unit tests run right after the build (they assert against _site/) and before
      # the slower validation and Lighthouse steps, so test failures surface fastest.
      - name: Run tests
        run: npm test

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate XML
        run: npm run validate:xml

      - name: Validate internal links
        run: npm run validate:links

      - name: Run Lighthouse CI
        run: npm run lighthouse