<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox ordering with groups</title>
  <!-- https://codepen.io/vojtechruz/pen/BaoNWGg -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flex-container">
  <div class="third">
    <p>A</p>
    <p>order: 2;</p>
  </div>
  <div class="third">
    <p>B</p>
    <p>order: 2;</p>
  </div>
  <div class="second">
    <p>C</p>
    <p>order: 1</p>
  </div>
  <div class="second">
    <p>D</p>
    <p>order: 1</p>
  </div>
  <div class="second">
    <p>E</p>
    <p>order: 1</p>
  </div>
  <div class="first">
    <p>F</p>
    <p>order not specified (0)</p>
  </div>
</div>
</body>
</html>
