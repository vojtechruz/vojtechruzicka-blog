<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox - justify content: space-around, space-evenly, space-between</title>
  <!-- https://codepen.io/vojtechruz/pen/wvKGYvx -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="caption">justify-content: space-between; (default)</div>
<div class="flex-container-space-between">
  <div>
    <p>1</p>
  </div>
  <div>
    <p>2</p>
  </div>
  <div>
    <p>3</p>
  </div>
  <div>
    <p>4</p>
  </div>
  <div>
    <p>5</p>
  </div>
  <div>
    <p>6</p>
  </div>
</div>
<div class="caption">justify-content: space-around;</div>
<div class="flex-container-space-around">
  <div>
    <p>1</p>
  </div>
  <div>
    <p>2</p>
  </div>
  <div>
    <p>3</p>
  </div>
  <div>
    <p>4</p>
  </div>
  <div>
    <p>5</p>
  </div>
  <div>
    <p>6</p>
  </div>
</div>
<div class="caption">justify-content: space-evenly;</div>
<div class="flex-container-space-evenly">
  <div>
    <p>1</p>
  </div>
  <div>
    <p>2</p>
  </div>
  <div>
    <p>3</p>
  </div>
  <div>
    <p>4</p>
  </div>
  <div>
    <p>5</p>
  </div>
  <div>
    <p>6</p>
  </div>
</div>
</body>
</html>
