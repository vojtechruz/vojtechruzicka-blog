<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox - flex-grow</title>
  <!-- https://codepen.io/vojtechruz/pen/bGVwJLg -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="caption">width: 60%;</div>
<div class="flex-container-small">
  <div class="grow-0"> flex-grow: 0; </div>
  <div class="grow-1"> flex-grow: 1; </div>
  <div class="grow-3"> flex-grow: 3; </div>
  <div class="grow-1"> flex-grow: 1; </div>
</div>
<div class="caption">width: 75%;</div>
<div class="flex-container-medium">
  <div class="grow-0"> flex-grow: 0; </div>
  <div class="grow-1"> flex-grow: 1; </div>
  <div class="grow-3"> flex-grow: 3; </div>
  <div class="grow-1"> flex-grow: 1; </div>
</div>
<div class="caption">width: 100%;</div>
<div class="flex-container-large">
  <div class="grow-0"> flex-grow: 0; </div>
  <div class="grow-1"> flex-grow: 1; </div>
  <div class="grow-3"> flex-grow: 3; </div>
  <div class="grow-1"> flex-grow: 1; </div>
</div>
</body>
</html>
