<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS: Position relative</title>
  <!-- https://codepen.io/vojtechruz/pen/mdJamVb -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<span class="container">

   
   <div class="original-box">
     <div class="box right">
        right: 20px;
     </div>
   </div>
      <div class="original-box">
     <div class="box left">
       left: 20px;
     </div>
   </div>
   <div class="original-box">
     <div class="box top">
       top: 20px;
     </div>
   </div>
   <div class="original-box">
     <div class="box bottom">
       bottom: 20px;
     </div>
   </div>
      <div class="original-box">
     <div class="box top left">
       left:&nbsp;20px;
       top:&nbsp;20px;
     </div>
   </div>
 </span>
