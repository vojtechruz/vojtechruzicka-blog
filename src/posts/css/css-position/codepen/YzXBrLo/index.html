<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS: Position absolute with static parent</title>
  <!-- https://codepen.io/vojtechruz/pen/YzXBrLo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="container-caption"> height: 200px; position: static;</div>
  <div class="box left top">
    position: absolute;  
    top:&nbsp;20px;
    left:&nbsp;20px;
  </div>
    <div class="box bottom right">
    position: absolute;  
    bottom: 20px;
    right: 20px;
  </div>
</div>
</body>
</html>
